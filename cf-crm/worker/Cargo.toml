[package]
name = "crm-worker"
version = "0.1.0"
edition = "2021"
description = "Worker de entrada (auth no D1) + Durable Object por tenant"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
crm-core = { path = "../core" }
crm-schema = { path = ".." }
worker = { version = "0.8.6", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", default-features = false }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.128"
