[package]
name = "crm-core"
version = "0.1.0"
edition = "2021"
description = "Regras de negócio do CRM: independentes de runtime, testadas com SQLite no host"
license = "MIT"

[dependencies]
crm-schema = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
