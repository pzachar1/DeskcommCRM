[package]
name = "crm-schema"
version = "0.1.0"
edition = "2021"
description = "Schema e modelo de dados do CRM (D1 global + SQLite por tenant em Durable Object)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
