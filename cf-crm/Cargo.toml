[package]
name = "crm-schema"
version = "0.1.0"
edition = "2021"
description = "Schema e modelo de dados do CRM (D1 global + SQLite por tenant em Durable Object)"
license = "MIT"

[dependencies]
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[workspace]
members = ["core", "worker"]
# `cargo test` na raiz roda só o que executa no host; o worker é wasm.
default-members = [".", "core"]
resolver = "2"
